services:
  langgraph:
    build:
      context: ./langgraph
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
    ports:
      - "${LANGGRAPH_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:751b617714b91e4cfd0186a509c72480c858e012976103b09a30dad053c36175
    depends_on:
      langgraph:
        condition: service_healthy
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      OPENAI_API_BASE_URL: http://langgraph:8000/v1
      OPENAI_API_KEY: DUMMY
      WEBUI_AUTH: "false"
      WEBUI_NAME: LangGraph OpenAI Serve
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
