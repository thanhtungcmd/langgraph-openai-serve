services:
  langgraph:
    build:
      context: ./langgraph
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    ports:
      - "${LANGGRAPH_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:751b617714b91e4cfd0186a509c72480c858e012976103b09a30dad053c36175
    depends_on:
      langgraph:
        condition: service_healthy
    environment:
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      OPENAI_API_BASE_URL: http://langgraph:8000/v1
      OPENAI_API_KEY: DUMMY
      WEBUI_AUTH: "false"
      WEBUI_NAME: LangGraph OpenAI Serve
    ports:
      - "${OPEN_WEBUI_PORT:-3000}:8080"
    volumes:
      - open-webui:/app/backend/data

  opencode:
    image: ${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode:2.0.0}
    profiles: ["opencode"]
    depends_on:
      langgraph:
        condition: service_healthy
    environment:
      OPENCODE_CONFIG: /config/opencode.json
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - ./opencode.json:/config/opencode.json:ro
      - ${OPENCODE_WORKSPACE:-..}:/workspace

volumes:
  open-webui:
